name: GaryMariner Security CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: garymariner-security-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
      - name: Toolchain
        run: |
          node --version
          npm --version
          git rev-parse HEAD
          sha256sum package-lock.json
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Guard and native tests
        run: |
          node scripts/verify-build-inputs.mjs
          npm run test:build-inputs
      - name: Lint and TypeScript
        run: |
          npm run lint
          ./node_modules/.bin/tsc --noEmit
      - name: Build
        run: timeout --kill-after=15s 10m npm run build
      - name: Dependency evidence
        if: always()
        run: |
          mkdir -p evidence
          npm ls --all --json > evidence/installed-tree.json
          npm sbom --sbom-format cyclonedx > evidence/sbom.json
          npm sbom --package-lock-only --sbom-format cyclonedx > evidence/sbom-lock.json
          set +e
          npm audit --json > evidence/audit.json
          audit_status=$?
          set -e
          test "$audit_status" -le 1
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const actual = JSON.parse(fs.readFileSync('evidence/audit.json'));
          const baseline = JSON.parse(fs.readFileSync('.github/security/dependency-baseline.json'));
          function normalized(report) {
            assert.equal(report.auditReportVersion, 2);
            assert.ok(report.vulnerabilities && report.metadata?.vulnerabilities);
            assert.ok(!report.error);
            return Object.entries(report.vulnerabilities).sort(([a],[b]) => a.localeCompare(b)).map(([name,v]) => ({
              name, severity:v.severity, range:v.range, nodes:[...v.nodes].sort(),
              via:v.via.map(x => typeof x === 'string' ? x : {source:x.source,url:x.url,range:x.range,severity:x.severity}).sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b))),
              effects:[...v.effects].sort(), fixAvailable:v.fixAvailable
            }));
          }
          assert.deepEqual(normalized(actual), normalized(baseline), 'Dependency findings changed: review required');
          JS
      - name: Lock integrity
        if: always()
        run: git diff --exit-code -- package.json package-lock.json
      - name: Retain allowlisted dependency reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-evidence
          path: |
            evidence/audit.json
            evidence/installed-tree.json
            evidence/sbom.json
            evidence/sbom-lock.json
          retention-days: 7
          if-no-files-found: error
      - name: Fail-closed verdict
        if: always()
        env:
          PRIOR_STATUS: ${{ job.status }}
        run: test "$PRIOR_STATUS" = success
