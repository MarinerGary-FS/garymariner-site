><script>function update(){const url=document.getElementById('source').value==='actual'?'http://127.0.0.1:3110/network':'http://127.0.0.1:3106/signal-room.html';document.querySelectorAll('iframe').forEach(f=>f.src=url);const w=Number(document.getElementById('width').value);const f=document.querySelector('.mobile iframe');f.style.width=w+'px';f.style.transform='scale('+293/w+')';document.querySelector('.mobile').style.height=844*293/w+'px';document.getElementById('mobile-label').textContent='MOBILE'+w+' ×844 · NATIVE CSS VIEWPORT';}function fit(){document.querySelector('.board').style.transform='scale('+Math.min(1,innerWidth/1240)+')'}document.getElementById('source').onchange=update;document.getElementById('width').onchange=update;fit();addEventListener('resize',fit);update();</script></html>
